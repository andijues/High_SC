<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="highsc-token" content="__SESSION_TOKEN__">
  <title>High_SC · 论文精读工作台</title>
  <link rel="icon" href="/static/brand/High_SC.ico" sizes="any">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳到工作区</a>
  <header class="app-header">
    <a class="brand" href="#workspace" aria-label="High_SC 工作台"><img class="brand-mark" src="/static/brand/icon.svg" alt="" width="34" height="34">High<span>_</span>SC</a>
    <span class="app-description">论文精读工作台</span>
    <nav aria-label="主导航"><a href="#workspace" data-page="workspace">工作台</a><a href="#settings" data-page="settings">模型设置</a><a href="#files" data-page="files">保存设置</a><a href="#help" data-page="help">使用说明</a></nav>
    <span class="local-state" id="connection-state">本机运行</span>
  </header>
  <div class="app-shell">
    <aside class="library" aria-label="本地论文库">
      <div class="library-heading"><h2>论文库</h2><button class="text-button" id="import-small">导入 PDF</button></div>
      <div id="paper-list" class="paper-list"><p class="library-empty">正在读取本地论文…</p></div>
      <div class="library-bottom"><a href="/example" target="_blank" rel="noopener">打开双栏批注示例 <span aria-hidden="true">↗</span></a><p>论文与进度保存在本机。<br><a href="#files">设置 HTML 保存目录</a></p></div>
    </aside>
    <main id="main" tabindex="-1"><div id="content"></div></main>
  </div>
  <input id="file-input" type="file" accept=".pdf,application/pdf" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <template id="welcome-template">
    <section class="welcome">
      <div class="page-heading"><h1>把论文读成一条论证链</h1><p>导入英文 PDF，生成原文、中文译文与逐段论证批注。</p></div>
      <div id="setup-hint" class="setup-hint" hidden><div><strong>先选择模型来源</strong><p>使用本机已登录的 Codex，或连接自己的模型 API。</p></div><a class="button primary" href="#settings">配置模型</a></div>
      <div class="welcome-grid">
        <div class="import-panel"><label class="drop-zone" id="drop-zone" for="file-input" tabindex="0"><span class="pdf-symbol">PDF</span><strong>拖入论文，或点击选择文件</strong><span>英文文字型 PDF · 最大 100 MB / 250 页</span><span class="button primary" id="choose-label">选择英文 PDF</span></label><div class="import-options"><label><input type="checkbox" id="auto-generate" checked> 导入后自动开始生成</label><label><input type="checkbox" id="enable-ocr"> 扫描件使用本机 OCR</label></div><p class="field-hint">OCR 需要本机安装 Tesseract。普通文字型论文无需开启。</p><p class="import-status" id="import-status" aria-live="polite"></p></div>
        <section class="example-panel"><h2>生成后的阅读方式</h2><a href="/example" target="_blank" rel="noopener" class="example-image"><img src="/static/example-preview.png" alt="自制教学文本的双栏批注示例：左侧英中对照，右侧逐段中文批注" loading="lazy"></a><p>用自制教学文本演示排版与论证批注；内容及图表为示意，不代表实证研究。</p><a href="/example" target="_blank" rel="noopener" class="text-link">阅读完整示例 →</a></section>
      </div>
      <div class="workflow"><div><b>全文分析</b><p>建立主张、证据与结论的联系。</p></div><div><b>逐段精读</b><p>完整翻译，标注功能、逻辑与边界。</p></div><div><b>离线带走</b><p>字体、图表和原文打包成一个 HTML。</p></div></div>
    </section>
  </template>
  <template id="files-template">
    <section class="settings-page"><div class="page-heading"><h1>把精读文件放在常用目录</h1><p>为生成的 HTML 单独设置保存位置，便于归档论文或分享给他人。</p></div>
      <form id="files-form" class="settings-form"><div class="form-section"><h2>HTML 保存位置</h2><label class="path-label" for="output-directory">保存文件夹</label><div class="path-control"><input id="output-directory" name="directory" required placeholder="选择文件夹或填写完整路径" autocomplete="off"><button class="button secondary" type="button" id="browse-output">选择文件夹</button></div><p class="field-hint">支持中文路径和空格。保存设置时会创建目录并检查写入权限。</p><label class="checkbox-line"><input name="auto_save" type="checkbox"> 生成完成或更新 HTML 后，自动保存到此目录</label><p class="field-hint">同名文件自动编号，保留已有版本。关闭自动保存后，可在论文页面点击“保存到指定目录”。</p></div><div class="form-actions"><button class="button primary" type="submit" id="save-output-settings">保存设置</button><button class="button secondary" type="button" id="open-output">打开文件夹</button><span id="output-status" role="status" aria-live="polite"></span></div></form>
      <div class="settings-note"><h2>两种保存方式</h2><p>“保存到指定目录”由 High_SC 直接写入上述文件夹；“浏览器下载”使用浏览器自己的下载位置。修改这里不会改变浏览器设置。</p><p>HTML 已内嵌图片、字体和原始 PDF，拿走一个文件即可离线阅读。模型配置、任务缓存与保存目录分别管理。</p><p>EXE 版通过系统托盘运行，右键托盘中的 High_SC 图标可打开工作台、数据目录或退出软件。</p></div>
    </section>
  </template>
  <template id="settings-template">
    <section class="settings-page"><div class="page-heading"><h1>选择模型调用方式</h1><p id="provider-description">配置保存在本机，可复用 Codex 的 ChatGPT 登录，或使用自己的模型 API。</p></div>
      <form id="settings-form" class="settings-form"><div class="form-section"><h2>连接配置</h2><div class="form-grid">
        <label class="full">模型来源<select name="api_style"><option value="codex">本机 Codex · 使用 ChatGPT 登录，无需 API Key</option><option value="chat">OpenAI 兼容 · Chat Completions</option><option value="responses">OpenAI 兼容 · Responses</option><option value="anthropic">Anthropic · Messages</option></select></label>
        <div class="full codex-info" id="codex-info" hidden><strong>使用已登录 Codex 的额度</strong><p>通过官方 Codex CLI 执行文本分析，无需另填 API Key。论文文本会交给 Codex 处理，使用你的 Codex 订阅额度及适用的用量计费。</p><span id="codex-login-state" role="status">正在检查本机登录…</span></div>
        <label class="full" data-api-only>API 基础地址<input name="base_url" type="url" placeholder="https://你的服务地址/v1" required><small>支持填写基础地址或完整接口地址。协议需与服务商提供的接口一致。</small></label>
        <label>模型名称<input name="model" placeholder="填写服务商提供的模型 ID" required></label>
        <label data-codex-only hidden>推理强度<select name="codex_effort"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="xhigh">Extra high（xhigh）</option><option value="max">Max</option></select></label>
        <label data-api-only>API 密钥<input name="api_key" type="password" placeholder="输入你的 API Key" autocomplete="new-password"><small id="key-state">Windows 下使用当前账户加密保存。</small></label>
        <label data-api-only>认证方式<select name="auth_mode"><option value="auto">按协议自动选择（推荐）</option><option value="bearer">Authorization: Bearer</option><option value="x-api-key">x-api-key</option><option value="api-key">api-key</option><option value="none">不自动发送认证头</option></select><small>中转渠道要求特殊认证时，可在兼容设置中添加请求头。</small></label>
      </div><label class="checkbox-line" data-api-only><input name="clear_api_key" type="checkbox"> 清除已保存的密钥（本地免密模型可留空）</label></div>
      <details class="advanced"><summary>生成参数与兼容设置</summary><div class="form-grid">
        <label data-api-only>接口地址处理<select name="endpoint_mode"><option value="auto">自动拼接协议路径（推荐）</option><option value="exact">完整地址原样使用</option></select><small>自定义网关路由可选“原样使用”；支持 api-version 等非敏感查询参数。</small></label>
        <label data-api-only>输出长度字段<select name="token_field"><option value="auto">按协议自动选择（推荐）</option><option value="max_tokens">max_tokens</option><option value="max_completion_tokens">max_completion_tokens</option><option value="max_output_tokens">max_output_tokens</option><option value="omit">不发送上限字段</option></select><small>请按渠道文档选择；不发送时由服务端决定，可能增加用量。</small></label>
        <label data-api-only>单次输出 token 上限<input name="max_tokens" type="number" min="512" max="131072"><small>译文被截断时，可提高上限或减小每批段落数。</small></label>
        <label class="full" data-codex-only hidden>Codex 程序路径（可选）<input name="codex_path" placeholder="留空自动寻找已安装的 codex.exe"><small>Codex 管理推理和输出预算；本页的每批段落数、上下文预算与超时仍然有效。</small></label>
        <label>每批段落数<input name="batch_size" type="number" min="1" max="12"><small>建议 2-4 段；段落长或模型输出短时选 1。</small></label>
        <label>上下文字符预算<input name="context_chars" type="number" min="8000" max="300000"><small>超过预算会先分块分析，再合成全文骨架。</small></label>
        <label>单次请求超时（秒）<input name="timeout" type="number" min="15" max="1800"></label>
        <label data-api-only>网络失败重试次数<input name="retries" type="number" min="0" max="5"></label>
        <label data-api-only>HTTP 代理（可选）<input name="proxy" placeholder="http://127.0.0.1:7897"><small>留空使用系统环境中的代理配置。</small></label>
        <label class="checkbox-line" data-api-only><input name="json_mode" type="checkbox"> 使用接口原生 JSON 模式</label>
        <label class="checkbox-line" data-api-only><input name="send_temperature" type="checkbox"> 发送 temperature 参数</label>
        <label data-api-only>Temperature<input name="temperature" type="number" min="0" max="2" step="0.1"><small>部分推理模型不接受此参数，默认不发送。</small></label>
        <label class="full" data-api-only>额外请求参数（JSON，可选）<textarea name="extra_body" rows="4" spellcheck="false" placeholder='{"reasoning_effort":"medium"}'></textarea><small>仅填写服务商要求的扩展参数，例如推理强度；不能覆盖消息与工具字段。</small></label>
        <label class="full" data-api-only>自定义请求头（JSON，可选）<textarea name="extra_headers" rows="3" spellcheck="false" autocomplete="off" placeholder='{"X-API-Key":"${API_KEY}"}'></textarea><small id="headers-state">留空保留已有值；使用 ${API_KEY} 引用上方密钥。Windows 下加密保存，不回显。</small></label>
        <label class="checkbox-line" data-api-only><input name="clear_extra_headers" type="checkbox"> 清除已保存的自定义请求头</label>
      </div></details>
      <div class="form-actions"><button type="submit" class="button primary" id="save-settings">保存配置</button><button type="button" class="button secondary" id="test-settings">测试连接</button><span id="settings-status" role="status" aria-live="polite"></span></div></form>
      <div class="settings-note"><h2>调用与用量</h2><p>使用擅长长文理解、学术翻译和推理的模型。测试只发送一条短指令，不上传论文。</p><p>本机 Codex 模式使用你的 Codex 额度；普通 API 模式按服务商规则计费。生成可能包含多次调用，已完成段落会缓存。Codex 模式可停止当前请求；API 模式在当前请求结束后暂停。</p></div>
    </section>
  </template>
  <template id="help-template"><section class="help-page"><div class="page-heading"><h1>从 PDF 到双栏批注</h1><p>生成、核对和带走，都在这个本地工作台完成。</p></div><ol class="help-steps"><li><h2>选择并测试模型</h2><p>在模型设置中选择“本机 Codex”，使用已登录的 ChatGPT 账号，无需 API Key；也可选择普通 API 协议并填写自己的地址和密钥。</p></li><li><h2>导入英文 PDF</h2><p>系统提取章节、段落、图题与参考文献，并保存原始 PDF。复杂表格和多栏排版可能需要核对，扫描件需安装 Tesseract 并启用 OCR。</p></li><li><h2>等待分阶段生成</h2><p>全文骨架 → 段落翻译与批注 → 图表说明 → 检查与打包。可以暂停和继续；网络失败后修正配置再继续，缓存内容保留。</p></li><li><h2>校对需要关注的段落</h2><p>在“段落校对”中修改译文、功能、逻辑角色、审视意见及高亮。数值提示是核对线索，不代表译文必然错误。修改后使用“更新 HTML”。</p></li><li><h2>预览或下载 HTML</h2><p>导出为单文件，内嵌图表、字体及原始 PDF，离线可读。生成时需要联网调用所选模型；查看已完成文件不需要联网。</p></li></ol><div class="settings-note"><h2>文件与恢复</h2><p>任务保存在本机数据目录：EXE 版为 <code>%LOCALAPPDATA%/High_SC/</code>，源码版为 <code>High_SC/data/</code>。其中 <code>source.pdf</code> 为原始论文，<code>annotated.html</code> 为导出结果，JSON 文件保存解析内容和生成进度。备份数据目录即可保留任务；Windows 加密密钥绑定当前账户，换电脑后请重新填写。</p><p>EXE 版双击程序启动，右键系统托盘图标退出；源码版使用“启动 High_SC.cmd”和“停止 High_SC.cmd”。可在顶部“保存设置”中更改 HTML 输出位置。</p></div></section></template>
</body></html>
